# Test-only patch over the shipped Web profile and the Loom bundle patch.
# It owns the model route, the persistence directory, the fixture adapter,
# a non-interactive child preset, and the autoloom tools; it turns off
# profile HMR and title generation as the Loom loader fixture does.
- id: agent-default-model
  config:
    provider: autoloom-mock
    model: autoloom-mock

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- id: hmr
  disabled: true

- id: session-title-llm
  disabled: true

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      loom-child:
        sandbox: read-only
        approval: never

- insert:
    - id: autoloom-mock-llm
      name: './mock-llm.ts'
    - id: tool-loom
      name: './tool-loom.ts'
      config:
        autoloom:
          maxBranches: 3
          childPermissionPreset: loom-child
